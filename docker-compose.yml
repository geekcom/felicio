services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    cap_drop:
      - ALL
    container_name: felicio
    volumes:
      - .:/var/www/app
      - .docker/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true